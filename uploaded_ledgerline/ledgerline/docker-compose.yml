services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledgerline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/db/roles.sql:/docker-entrypoint-initdb.d/02-roles.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledgerline"]
      interval: 2s
      retries: 30

  api:
    build: ./backend
    environment:
      # The API connects as the least-privilege role created by roles.sql.
      DATABASE_URL: postgresql://ledgerline_app:ledgerline_app@db:5432/ledgerline
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      DB_POOL_MAX: "20"
      WEB_CONCURRENCY: "4"
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]

  web:
    build: ./frontend
    depends_on: [api]
    ports: ["5173:80"]

volumes:
  pgdata:
